name: Development verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: bash scripts/install-deps.sh
      - run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: reports/
# This workflow was written, NOT run, in the delivery environment.
# Pin workflow actions to reviewed immutable SHAs before a release workflow is trusted.
