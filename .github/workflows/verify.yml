name: Development verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    # Full via-IR compilation of the expanded handoff fixtures can exceed 30 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.4
          cache: false
      - run: bash scripts/install-deps.sh
      - run: bash scripts/verify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-evidence
          path: reports/
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.4
          cache: false
      - run: bash scripts/install-deps.sh
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-slither.lock
      - run: bash scripts/verify-slither.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: static-analysis-evidence
          path: reports/production/slither-current.*
  robinhood-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Optional archive endpoint; the public fallback contains no credentials.
      ROBINHOOD_FORK_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://robinhood.rpc.pinax.network' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.4
          cache: false
      - run: bash scripts/install-deps.sh
      - name: Install checksum-pinned current fork compiler
        id: current-solc
        shell: bash
        run: |
          set -euo pipefail
          solc="$RUNNER_TEMP/solc-0.8.26"
          # SHA256 from Solidity's official linux-amd64/list.json; verify before execution.
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 120 --output "$solc" 'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a'
          printf '%s  %s\n' 'd5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef' "$solc" | sha256sum --check --strict
          chmod 755 "$solc"
          printf 'solc=%s\n' "$solc" >> "$GITHUB_OUTPUT"
      - name: Current selected native-pool fork tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/production
          python3 scripts/run-current-pool-fork.py --rpc-env ROBINHOOD_FORK_RPC_URL --solc "${{ steps.current-solc.outputs.solc }}" --output reports/production/current-pool-fork 2>&1 | tee reports/production/current-pool-fork.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: robinhood-fork-evidence
          path: |
            reports/production/current-pool-fork.log
            reports/production/current-pool-fork/receipt.json
            reports/production/current-pool-fork/forge-results.json
            reports/production/current-pool-fork/forge-stderr.log
# Immutable action revisions and dependency checks support development verification.
# Passing this workflow does not authorize a funded deployment or replace an audit.
