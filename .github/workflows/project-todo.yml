name: Project Todo consistency
on:
  push:
    paths: ['TODO.md', 'docs/project-todo.json', 'scripts/sync-project-todo.py', '.github/workflows/project-todo.yml']
  pull_request:
    paths: ['TODO.md', 'docs/project-todo.json', 'scripts/sync-project-todo.py', '.github/workflows/project-todo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  todo-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 scripts/sync-project-todo.py --check
