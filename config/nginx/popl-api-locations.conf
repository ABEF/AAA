# Include inside ONE reviewed HTTPS website server {}. Leave website locations
# intact. API services require --proxy-origin https://THE-EXACT-WEBSITE-HOST.
# Exact route/method allowlists; no arbitrary proxy or default backend exposure.
location ~ "^/v1/(protocol|mint-readiness|earnings|collection/(0|[1-9][0-9]{0,15})/(0|[1-9][0-9]{0,2})|nfts/(0|[1-9][0-9]{0,77})(/earnings)?|wallets/0x[0-9a-fA-F]{40}/(nfts|(summary|earnings)/(0|[1-9][0-9]{0,15})/(0|[1-9][0-9]{0,2})))$" {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/popl/popl-api-common.conf;
    proxy_set_header Host 127.0.0.1:8787;
    proxy_pass http://127.0.0.1:8787;
}
location = /v1/transactions/prepare {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/popl/popl-api-common.conf;
    proxy_set_header Host 127.0.0.1:8787;
    proxy_pass http://127.0.0.1:8787;
}
location = /v1/activation/prepare {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/popl/popl-api-common.conf;
    proxy_set_header Host 127.0.0.1:8788;
    proxy_pass http://127.0.0.1:8788;
}
location /v1/ {
    include /etc/nginx/popl/popl-api-common.conf;
    return 404;
}
location = /v1 {
    include /etc/nginx/popl/popl-api-common.conf;
    return 404;
}
