# Included inside every allowed API location. Deploy to /etc/nginx/popl/.
limit_conn popl_client_connections 2;
limit_conn popl_api_connections 6;
limit_conn_status 429;
limit_req zone=popl_api_rate burst=8 nodelay;
limit_req_status 429;
limit_req_log_level notice;
limit_conn_log_level notice;
# Expected rejections are counted in the sanitized access log. Ordinary nginx
# error logs can contain a raw request path: do not enable verbose error logging.
error_log /var/log/nginx/popl-api-error.log crit;
access_log /var/log/nginx/popl-api-access.log popl_api;

client_max_body_size 16k;
client_body_buffer_size 16k;
client_body_timeout 5s;
send_timeout 5s;
proxy_connect_timeout 1s;
proxy_send_timeout 5s;
proxy_read_timeout 35s;
proxy_http_version 1.0;
proxy_request_buffering on;
proxy_buffering off;
proxy_cache off;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_pass_request_headers off;
proxy_set_header Connection close;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Origin $http_origin;
proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
# Overwrite caller-supplied identity. Never forward arbitrary XFF, Forwarded,
# Authorization, cookies or caller X-PoPL-Client-IP values to the read service.
proxy_set_header X-PoPL-Client-IP $remote_addr;
proxy_hide_header Server;
proxy_hide_header Cache-Control;
proxy_hide_header Retry-After;
add_header Cache-Control no-store always;
add_header X-Content-Type-Options nosniff always;
# A conservative delay for edge rejections (including upstream 429/503).
add_header Retry-After $popl_retry_after always;
