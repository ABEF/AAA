# Include once inside nginx's http {}. This is a candidate, not live hosting.
# Direct-client TLS termination only. Do not enable real_ip_header/trust XFF
# without a separately reviewed edge policy (see docs/API_INGRESS.md).
limit_conn_zone $binary_remote_addr zone=popl_client_connections:1m;
limit_conn_zone $server_name zone=popl_api_connections:1m;
limit_req_zone $server_name zone=popl_api_rate:1m rate=8r/s;
map $status $popl_retry_after {
    default "";
    429 10;
    503 10;
}

# No URI, query, body, IP, wallet address, referrer or user agent is logged.
log_format popl_api escape=json '{"event":"api_edge","status":$status,'
    '"elapsed":$request_time,"upstream_status":"$upstream_status",'
    '"rate":"$limit_req_status","connections":"$limit_conn_status"}';
