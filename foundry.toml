[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
# Solidity 0.8.26's Yul optimizer crashes when assembling ZZZVault bytecode.
# Retain the EVM optimizer and enforce the normal runtime/initcode size limits.
# Favor deployment size for the custody contract; benchmark execution gas before release.
optimizer_details = { yul = false }
via_ir = true
ffi = false
fs_permissions = [{ access = "write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "forge-std/=lib/forge-std/src/"
]
[profile.default.fuzz]
runs = 1000
[profile.default.invariant]
runs = 32
depth = 128
fail_on_revert = true
[profile.audit.invariant]
runs = 256
depth = 256
fail_on_revert = true
[fmt]
line_length = 120
